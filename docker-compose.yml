services:
  db:
    image: postgis/postgis:16-3.4
    container_name: gymon_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gymon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gymon_password}
      POSTGRES_DB: ${POSTGRES_DB:-gymon_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
